<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>FisheriesCast Mobile</title>

    <!-- CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
      :root {
        --primary: #0061f2;
        --secondary: #6900c7;
        --success: #00ac69;
        --warning: #f4a100;
        --danger: #e81500;
        --bg: #f2f6fc;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --radius: 16px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-bottom: calc(100px + env(safe-area-inset-bottom));
        overscroll-behavior-y: contain;
      }

      /* Navbar */
      .navbar {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.85);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .navbar-brand {
        font-weight: 700;
        color: var(--primary);
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* FAB */
      .fab-container {
        position: fixed;
        right: 20px;
        bottom: calc(20px + env(safe-area-inset-bottom));
        z-index: 1050;
      }

      .btn-fab {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #fff;
        border: none;
        font-size: 1.3rem;
        box-shadow: 0 4px 12px rgba(0, 97, 242, 0.4);
        transition: transform 0.15s;
      }

      .btn-fab:active {
        transform: scale(0.9);
      }

      /* KPI Cards */
      .kpi-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 1rem;
        box-shadow: var(--shadow);
        position: relative;
        border-left: 4px solid;
        transition: transform 0.15s;
      }

      .kpi-card:active {
        transform: scale(0.98);
      }

      .kpi-card.blue {
        border-color: var(--primary);
      }
      .kpi-card.orange {
        border-color: var(--warning);
      }
      .kpi-card.teal {
        border-color: var(--success);
      }
      .kpi-card.purple {
        border-color: var(--secondary);
      }

      .kpi-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      .kpi-value {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .kpi-unit {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .kpi-icon {
        position: absolute;
        right: 10px;
        top: 10px;
        font-size: 1.2rem;
        opacity: 0.15;
      }

      /* Charts */
      .chart-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 1.25rem;
        box-shadow: var(--shadow);
        margin-bottom: 1.5rem;
      }

      .chart-title {
        font-size: 0.95rem;
        font-weight: 700;
      }

      .chart-subtitle {
        font-size: 0.75rem;
        color: var(--muted);
      }

      select {
        min-height: 44px;
        font-size: 0.85rem;
      }

      /* Offcanvas */
      .offcanvas-bottom {
        border-radius: 24px 24px 0 0;
        max-height: 85vh;
      }

      .drag-handle {
        width: 40px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        margin: 12px auto;
      }

      /* Loader */
      #loader {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div id="loader">
      <div class="spinner-border text-primary"></div>
      <p class="small fw-bold text-muted mt-3">Loading Dashboard...</p>
    </div>

    <nav class="navbar px-3">
      <span class="navbar-brand">
        <i class="bi bi-tsunami"></i> FisheriesCast
      </span>
      <span class="badge bg-light border text-dark" id="total-records"
        >0 Rows</span
      >
    </nav>

    <div class="fab-container">
      <button
        class="btn-fab"
        data-bs-toggle="offcanvas"
        data-bs-target="#filterDrawer"
      >
        <i class="bi bi-sliders2"></i>
      </button>
    </div>

    <div class="container-fluid px-3 py-3">
      <!-- KPIs -->
      <div class="row g-2 mb-4">
        <div class="col-6">
          <div class="kpi-card blue">
            <i class="bi bi-box kpi-icon"></i>
            <div class="kpi-label">Catch</div>
            <div class="kpi-value" id="kpi-catch">-</div>
            <div class="kpi-unit">Metric Tons</div>
          </div>
        </div>
        <div class="col-6">
          <div class="kpi-card orange">
            <i class="bi bi-thermometer-sun kpi-icon"></i>
            <div class="kpi-label">Temp</div>
            <div class="kpi-value" id="kpi-temp">-</div>
            <div class="kpi-unit">°C Avg</div>
          </div>
        </div>
        <div class="col-6">
          <div class="kpi-card teal">
            <i class="bi bi-speedometer kpi-icon"></i>
            <div class="kpi-label">Pressure</div>
            <div class="kpi-value" id="kpi-pressure">-</div>
            <div class="kpi-unit">hPa</div>
          </div>
        </div>
        <div class="col-6">
          <div class="kpi-card purple">
            <i class="bi bi-wind kpi-icon"></i>
            <div class="kpi-label">Wind</div>
            <div class="kpi-value" id="kpi-wind">-</div>
            <div class="kpi-unit">km/h</div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="chart-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <div class="chart-title">Environment Impact</div>
            <div class="chart-subtitle">Correlation</div>
          </div>
          <select id="scatter-metric" onchange="updateScatterChart()">
            <option value="temperature">Temp</option>
            <option value="pressure">Pressure</option>
            <option value="wind_speed">Wind</option>
            <option value="humidity">Humidity</option>
          </select>
        </div>
        <div style="height: 250px"><canvas id="scatterChart"></canvas></div>
      </div>

      <div class="chart-card">
        <div class="chart-title mb-2">Seasonality</div>
        <div style="height: 250px"><canvas id="seasonChart"></canvas></div>
      </div>

      <div class="chart-card">
        <div class="chart-title mb-2">Catch Composition</div>
        <div style="height: 220px"><canvas id="speciesChart"></canvas></div>
      </div>
    </div>

    <!-- Filter Drawer -->
    <div class="offcanvas offcanvas-bottom" id="filterDrawer">
      <div class="drag-handle"></div>
      <div class="offcanvas-body">
        <select id="filter-species" class="form-select mb-2"></select>
        <select id="filter-year" class="form-select mb-2"></select>
        <select id="filter-state" class="form-select mb-2"></select>
        <select id="filter-gear" class="form-select mb-3"></select>

        <button
          class="btn btn-primary w-100 mb-2"
          onclick="applyFilters(); bootstrap.Offcanvas.getInstance(filterDrawer).hide();"
        >
          View Results
        </button>
        <button
          class="btn btn-light text-danger w-100"
          onclick="resetFilters()"
        >
          Reset
        </button>
      </div>
    </div>

    <script>
      const CSV_PATH =
        "/static/data/final_combined_fisheries_weather_dataset.csv";
      let globalData = [],
        filteredData = [];
      let charts = {};

      const el = (id) => document.getElementById(id);

      window.onload = () => {
        Papa.parse(CSV_PATH, {
          download: true,
          header: true,
          dynamicTyping: true,
          complete: (r) => {
            globalData = r.data;
            initFilters(globalData);
            applyFilters();
            el("loader").classList.add("d-none");
          },
        });
      };

      function initFilters(d) {
        fill("filter-species", uniq(d, "species"));
        fill("filter-year", uniq(d, "year"));
        fill("filter-state", uniq(d, "state"));
        fill("filter-gear", uniq(d, "gear_type"));
      }

      const uniq = (d, k) => [
        "all",
        ...new Set(d.map((x) => x[k]).filter(Boolean)),
      ];
      const fill = (id, a) => a.forEach((v) => el(id).add(new Option(v, v)));

      function applyFilters() {
        filteredData = globalData.filter((d) => {
          return ["species", "year", "state", "gear_type"].every((k) => {
            const v = el("filter-" + k.replace("_type", "")).value;
            return v === "all" || d[k] == v;
          });
        });
        el("total-records").innerText = `${filteredData.length} Rows`;
        updateKPIs();
        updateScatterChart();
        updateSeasonChart();
        updateSpeciesChart();
      }

      function resetFilters() {
        document.querySelectorAll("select").forEach((s) => (s.value = "all"));
        applyFilters();
      }

      function updateKPIs() {
        let c = 0,
          t = 0,
          p = 0,
          w = 0,
          tc = 0,
          pc = 0,
          wc = 0;
        filteredData.forEach((d) => {
          c += d.landings || 0;
          if (d.temperature) (t += d.temperature), tc++;
          if (d.pressure) (p += d.pressure), pc++;
          if (d.wind_speed) (w += d.wind_speed), wc++;
        });
        el("kpi-catch").innerText = Math.round(c).toLocaleString();
        el("kpi-temp").innerText = tc ? (t / tc).toFixed(1) + "°" : "-";
        el("kpi-pressure").innerText = pc ? Math.round(p / pc) : "-";
        el("kpi-wind").innerText = wc ? (w / wc).toFixed(1) : "-";
      }

      function updateScatterChart() {
        const m = el("scatter-metric").value;
        const data = filteredData
          .filter((d) => d[m] && d.landings)
          .map((d) => ({ x: d[m], y: d.landings }));

        if (!charts.scatter) {
          charts.scatter = new Chart(scatterChart, {
            type: "scatter",
            data: {
              datasets: [
                { data, backgroundColor: "rgba(0,97,242,.5)", pointRadius: 3 },
              ],
            },
            options: { responsive: true, maintainAspectRatio: false },
          });
        } else {
          charts.scatter.data.datasets[0].data = data;
          charts.scatter.update("none");
        }
      }

      function updateSeasonChart() {
        const m = Array(12).fill(0),
          c = Array(12).fill(0),
          n = Array(12).fill(0);
        filteredData.forEach((d) => {
          if (d.month) {
            c[d.month - 1] += d.landings || 0;
            n[d.month - 1]++;
          }
        });
        if (!charts.season) {
          charts.season = new Chart(seasonChart, {
            type: "bar",
            data: {
              labels: "JFMAMJJASOND".split(""),
              datasets: [{ data: c, backgroundColor: "#e2e8f0" }],
            },
            options: { responsive: true, maintainAspectRatio: false },
          });
        } else {
          charts.season.data.datasets[0].data = c;
          charts.season.update("none");
        }
      }

      function updateSpeciesChart() {
        const map = {};
        filteredData.forEach(
          (d) => (map[d.species] = (map[d.species] || 0) + (d.landings || 0))
        );
        const top = Object.entries(map)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
        if (!charts.species) {
          charts.species = new Chart(speciesChart, {
            type: "doughnut",
            data: {
              labels: top.map((x) => x[0]),
              datasets: [{ data: top.map((x) => x[1]) }],
            },
            options: { responsive: true, maintainAspectRatio: false },
          });
        } else {
          charts.species.data.labels = top.map((x) => x[0]);
          charts.species.data.datasets[0].data = top.map((x) => x[1]);
          charts.species.update("none");
        }
      }
    </script>
  </body>
</html>
